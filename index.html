<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Race Track</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/menu.css">
    </head>
    <body>
        <div id="menu">
            <h1>Race Sim</h1>
            <button id="play" onclick="start()">Play</button>
            <div class="carousel">
                <button class="carousel-button button" onclick="selectMap(true)">
                    <
                </button>
                <p id="map-text">Track: 01</p>
                <button class="carousel-button button" onclick="selectMap(false)">
                    >
                </button>
            </div>
            <div class="carousel">
                <button class="carousel-button button" onclick="changePlayerCount(-1)">
                    -
                </button>
                <p id="player-text">Players: 2</p>
                <button class="carousel-button button" onclick="changePlayerCount(1)">
                    +
                </button>
            </div>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas">
                Your browser does not support the HTML5 canvas tag.
            </canvas>
        </div> 
        <script src="js/player.js"></script>
        <script src="js/board.js"></script>
        <script src="js/main.js"></script>
        <script src="js/menu.js"></script>
    </body>
</html>
